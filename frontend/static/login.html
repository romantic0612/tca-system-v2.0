<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智融 · 登录</title>
<style>
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f8f9fa;
    --color-border-tertiary: #e5e7eb;
    --color-border-secondary: #d1d5db;
    --color-text-primary: #333333;
    --color-text-secondary: #666666;
    --color-text-tertiary: #9ca3af;
    --color-c-blue-600: #667eea;
    --color-c-blue-800: #1e40af;
    --color-c-blue-50: #eff6ff;
    --color-c-teal-50: #f0fdfa;
    --color-c-teal-800: #115e59;
    --color-c-teal-600: #0d9488;
    --color-c-gray-50: #f9fafb;
    --color-c-gray-800: #1f2937;
    --color-c-gray-600: #6b7280;
    --gradient-brand: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-btn: linear-gradient(135deg, #2E86AB 0%, #4CAF50 100%);
    --shadow-card: 0 15px 50px rgba(0,0,0,0.25);
    --shadow-btn: 0 4px 15px rgba(46,134,171,0.3);
    --shadow-btn-hover: 0 6px 20px rgba(46,134,171,0.4);
    --shadow-text: 2px 2px 4px rgba(0,0,0,0.2);
    --shadow-input-focus: 0 0 0 3px rgba(46,134,171,0.1);
    --border-radius-lg: 20px;
    --border-radius-md: 12px;
    --border-radius-sm: 8px;
    --border-radius-xl: 24px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
  }
  /* ===== 标题区域：直接显示在渐变背景上 ===== */
  .header-section {
    text-align: center;
    margin-bottom: 32px;
  }
  .header-section .title-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.25));
  }
  .header-section h1 {
    font-size: 42px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 2px 3px 6px rgba(0,0,0,0.30);
    letter-spacing: 4px;
    margin-bottom: 10px;
  }
  .header-section .subtitle {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255,255,255,0.90);
    text-shadow: 1px 1px 4px rgba(0,0,0,0.20);
    letter-spacing: 2px;
  }

  /* ===== 登录表单卡片 ===== */
  .login-card {
    background: var(--color-background-primary);
    border-radius: var(--border-radius-xl);
    padding: 36px 32px 28px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.30);
    backdrop-filter: blur(4px);
  }
  .login-card .form-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: 24px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .login-card .form-title .title-icon-small {
    font-size: 20px;
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    font-size: 14px;
    font-weight: 600;
    color: #444;
    display: block;
    margin-bottom: 6px;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrapper input {
    width: 100%;
    background: #f0f2f8;
    border: 2px solid transparent;
    border-radius: var(--border-radius-md);
    padding: 14px 16px;
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
    font-family: var(--font-sans);
  }
  .input-wrapper input:focus {
    background: #ffffff;
    border-color: #2E86AB;
    box-shadow: 0 0 0 3px rgba(46,134,171,0.12);
  }
  .input-wrapper input::placeholder {
    color: #b0b8c8;
  }
  /* 密码眼睛图标 */
  .toggle-pwd {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 20px;
    color: #999;
    user-select: none;
    transition: color 0.2s;
    line-height: 1;
    background: none;
    border: none;
    padding: 4px;
  }
  .toggle-pwd:hover {
    color: #2E86AB;
  }

  .error-msg {
    color: #dc2626;
    font-size: 13px;
    margin-top: 4px;
    margin-bottom: 10px;
    display: none;
    text-align: center;
  }

  .btn-login {
    width: 100%;
    padding: 14px 20px;
    background: var(--gradient-btn);
    color: white;
    border: none;
    border-radius: var(--border-radius-md);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(46,134,171,0.35);
    transition: all 0.3s ease;
    font-family: var(--font-sans);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-login:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(46,134,171,0.45);
  }
  .btn-login:active {
    transform: translateY(0);
  }
  .btn-login .btn-icon {
    font-size: 18px;
  }

  /* ===== 快捷登录 ===== */
  .accounts {
    margin-top: 28px;
    width: 100%;
    max-width: 400px;
  }
  .accounts-label {
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.60);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .account-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 14px 12px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: var(--border-radius-lg);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .account-item {
    text-align: center;
    padding: 12px 6px;
    border-radius: var(--border-radius-md);
    cursor: pointer;
    transition: all 0.25s ease;
    background: rgba(255,255,255,0.10);
  }
  .account-item:hover {
    background: rgba(255,255,255,0.22);
    transform: translateY(-2px);
  }
  .account-item.student { background: rgba(46,134,171,0.20); }
  .account-item.teacher { background: rgba(46,134,171,0.20); }
  .account-item.admin { background: rgba(118,75,162,0.25); }
  .account-item.student:hover { background: rgba(46,134,171,0.35); }
  .account-item.teacher:hover { background: rgba(46,134,171,0.35); }
  .account-item.admin:hover { background: rgba(118,75,162,0.40); }
  .account-icon {
    font-size: 24px;
    margin-bottom: 4px;
  }
  .account-label {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.90);
  }
  .account-username {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
  }

  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: rgba(255,255,255,0.50);
    text-align: center;
    letter-spacing: 1px;
  }
</style>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/js/websocket.js"></script>
</head>
<body>

  <!-- ===== 标题区域（直接显示在紫色渐变背景上） ===== -->
  <div class="header-section">
    <span class="title-icon">🎓</span>
    <h1>智融</h1>
    <p class="subtitle">教师可控自适应学习系统</p>
  </div>

  <!-- ===== 登录表单卡片（白色背景悬浮） ===== -->
  <div class="login-card">
    <div class="form-title">
      <span class="title-icon-small">🔐</span>
      <span>用户登录</span>
    </div>

    <div class="form-group">
      <label for="username">账号</label>
      <div class="input-wrapper">
        <input type="text" id="username" value="20240003" placeholder="请输入账号">
      </div>
    </div>

    <div class="form-group">
      <label for="password">密码</label>
      <div class="input-wrapper">
        <input type="password" id="password" value="123456" placeholder="请输入密码">
        <button type="button" class="toggle-pwd" id="togglePwdBtn" onclick="togglePassword()" aria-label="显示/隐藏密码">👁️</button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg">账号或密码错误</div>

    <button class="btn-login" onclick="handleLogin()">
      <span class="btn-icon">🔑</span>
      <span>登 录</span>
    </button>
  </div>

  <!-- ===== 快捷登录 ===== -->
  <div class="accounts">
    <div class="accounts-label">— 快捷登录 —</div>
    <div class="account-grid">
      <div class="account-item student" onclick="quickLogin('20240003','123456')">
        <div class="account-icon">🧑‍🎓</div>
        <div class="account-label">学生</div>
        <div class="account-username">20240003 · TCA</div>
      </div>
      <div class="account-item teacher" onclick="quickLogin('100001','teacher123')">
        <div class="account-icon">👩‍🏫</div>
        <div class="account-label">教师</div>
        <div class="account-username">100001</div>
      </div>
      <div class="account-item admin" onclick="quickLogin('900001','admin123')">
        <div class="account-icon">🛠️</div>
        <div class="account-label">管理员</div>
        <div class="account-username">900001</div>
      </div>
    </div>
  </div>

  <div class="footer">
    智融 · 华东师范大学 · v2.0
  </div>

<script>
function handleLogin() {
  var username = document.getElementById('username').value;
  var password = document.getElementById('password').value;
  quickLogin(username, password);
}

function quickLogin(username, password) {
  fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_id: username, password: password})
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      var role = data.role;
      var routes = {
        'student': 'student.html',
        'teacher': 'teacher.html',
        'admin_exp': 'admin.html',
        'admin_sys': 'admin.html'
      };
      window.location.href = data.redirect || routes[role] || 'student.html';
    } else {
      document.getElementById('errorMsg').textContent = data.error;
      document.getElementById('errorMsg').style.display = 'block';
    }
  })
  .catch(error => {
    document.getElementById('errorMsg').textContent = '网络错误';
    document.getElementById('errorMsg').style.display = 'block';
  });
}

function togglePassword() {
  var pwdInput = document.getElementById('password');
  var btn = document.getElementById('togglePwdBtn');
  if (pwdInput.type === 'password') {
    pwdInput.type = 'text';
    btn.textContent = '🙈';
  } else {
    pwdInput.type = 'password';
    btn.textContent = '👁️';
  }
}
</script>
</body>
</html>
